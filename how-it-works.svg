<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Request flow: You ask Claude Code in plain English; Claude Code calls the local read-only MCP server; the MCP server reads a token from the sf CLI and queries your Salesforce org's read-only /ssot/* REST API over HTTPS.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
  </defs>

  <!-- self-contained surface: renders identically on GitHub light and dark themes -->
  <rect x="1" y="1" width="998" height="318" rx="16" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <!-- ============ edges (drawn first, under the cards) ============ -->
  <!-- You -> Claude Code -->
  <line x1="200" y1="155" x2="260" y2="155" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="146" text-anchor="middle" font-size="10.5" fill="#52514e">asks</text>

  <!-- Claude Code -> MCP server -->
  <line x1="440" y1="155" x2="500" y2="155" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="470" y="146" text-anchor="middle" font-size="10.5" fill="#52514e">MCP tools</text>

  <!-- MCP server -> your org (up-right), HTTPS -->
  <path d="M680 140 C 718 116, 720 92, 752 80" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="726" y="112" text-anchor="middle" font-size="10.5" fill="#52514e">HTTPS</text>

  <!-- MCP server -> sf CLI (down-right), token -->
  <path d="M680 170 C 718 194, 720 218, 752 230" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="724" y="212" text-anchor="middle" font-size="10.5" fill="#52514e">reads token</text>

  <!-- ============ nodes ============ -->

  <!-- You -->
  <g>
    <rect x="24" y="120" width="176" height="70" rx="12" fill="#f4f3f0" stroke="#898781" stroke-width="1.5"/>
    <rect x="38" y="141" width="28" height="28" rx="8" fill="#898781"/>
    <circle cx="52" cy="151" r="4.5" fill="#fff"/>
    <path d="M45 165 a7 7 0 0 1 14 0 z" fill="#fff"/>
    <text x="78" y="150" font-size="15" font-weight="600" fill="#0b0b0b">You</text>
    <text x="78" y="168" font-size="11" fill="#52514e">in plain English</text>
  </g>

  <!-- Claude Code -->
  <g>
    <rect x="264" y="120" width="176" height="70" rx="12" fill="#e8f1fb" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="278" y="141" width="28" height="28" rx="8" fill="#2a78d6"/>
    <path d="M292 143 l2.4 5.2 5.6 .8 -4 4 1 5.6 -5-2.7 -5 2.7 1-5.6 -4-4 5.6-.8 z" fill="#fff"/>
    <text x="318" y="150" font-size="15" font-weight="600" fill="#0b0b0b">Claude Code</text>
    <text x="318" y="168" font-size="11" fill="#52514e">AI client</text>
  </g>

  <!-- MCP server -->
  <g>
    <rect x="504" y="120" width="176" height="70" rx="12" fill="#e8f1fb" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="518" y="141" width="28" height="28" rx="8" fill="#2a78d6"/>
    <rect x="525" y="147" width="14" height="4.5" rx="1.5" fill="#fff"/>
    <rect x="525" y="154.5" width="14" height="4.5" rx="1.5" fill="#fff"/>
    <rect x="525" y="162" width="14" height="4.5" rx="1.5" fill="#fff"/>
    <text x="558" y="150" font-size="15" font-weight="600" fill="#0b0b0b">MCP server</text>
    <text x="558" y="168" font-size="11" fill="#52514e">local, on your machine</text>
  </g>

  <!-- read-only badge under MCP server -->
  <g>
    <rect x="518" y="204" width="162" height="26" rx="13" fill="#dff5df" stroke="#0ca30c" stroke-width="1.2"/>
    <path d="M532 215 v-3 a4 4 0 0 1 8 0 v3 M530 215 h12 v9 h-12 z" fill="none" stroke="#006300" stroke-width="1.6"/>
    <text x="548" y="221" font-size="11" font-weight="600" fill="#006300">read-only &#183; SELECT only</text>
  </g>

  <!-- Your Salesforce org -->
  <g>
    <rect x="760" y="46" width="216" height="70" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
    <rect x="774" y="67" width="28" height="28" rx="8" fill="#eb6834"/>
    <path d="M781 85 a5 5 0 0 1 1-9 6 6 0 0 1 11-1 4.5 4.5 0 0 1 1 10 z" fill="#fff"/>
    <text x="814" y="75" font-size="14.5" font-weight="600" fill="#0b0b0b">Your Salesforce org</text>
    <text x="814" y="93" font-size="11" fill="#52514e">/ssot/* REST API</text>
  </g>

  <!-- sf CLI -->
  <g>
    <rect x="760" y="196" width="216" height="70" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
    <rect x="774" y="217" width="28" height="28" rx="8" fill="#eb6834"/>
    <path d="M780 225 l5 6 -5 6 M788 237 h6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="814" y="225" font-size="14.5" font-weight="600" fill="#0b0b0b">sf CLI</text>
    <text x="814" y="243" font-size="11" fill="#52514e">reuses your sf session</text>
  </g>
</svg>
